<div class="rule">
    <h4>一般信息</h4>
    <ul>
        <li>可按货币和产品过滤数据。</li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>搜索过滤器</h4>
    <ul>
        <li>
            <b>货币：</b>以货币來选择所会列出的数据。
            <ul>
                <li><b>全部：</b>列出所有支持的货币。</li>
            </ul>
        </li>
        <li><b>基础货币：</b>将所有资料转换为基础货币但仅供参考。</li>
        <li><b>产品：</b>以产品类型來选择所会列出的数据。</li>
    </ul>
</div>
<div class="line">
</div>
<div class="rule">
    <h4>报告指南</h4>
    <ul>
        <li><b>用户名：</b>会员注册的用户名。欲知更多信息，点击用户名可查看会员所有待定投注的列表。</li>
        <li><b>系统账号：</b>系统为每个账户产生的数字序列ID。</li>
        <li><b>投注数：</b>待定投注票的数量。</li>
        <li><b>待定资金：</b>结果待定的总投注额</li>
    </ul>
</div>
